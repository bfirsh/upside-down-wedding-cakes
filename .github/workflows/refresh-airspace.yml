name: Refresh airspace data

# The FAA republishes on the 28-day chart cycle. Weekly is comfortably often
# enough to pick up a change within a few days of it going live.
on:
  schedule:
    - cron: '17 9 * * 1'      # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-data.mjs'
      - '.github/workflows/refresh-airspace.yml'

permissions:
  contents: write

concurrency:
  group: refresh-airspace
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and tile FAA airspace
        run: node scripts/build-data.mjs

      - name: Sanity-check the output
        run: |
          test -f data/index.json || { echo "no index.json"; exit 1; }
          COUNT=$(node -p "require('./data/index.json').features")
          echo "features: $COUNT"
          # A real national dataset is thousands of volumes. Anything tiny means
          # the FAA service partially failed — fail loudly instead of committing
          # a truncated dataset over a good one.
          if [ "$COUNT" -lt 2000 ]; then echo "suspiciously few features"; exit 1; fi
          du -sh data

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change in FAA data."
          else
            git commit -m "Refresh airspace data from FAA AIS ($(date -u +%Y-%m-%d))"
            git push
          fi
